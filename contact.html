    <main class="form-page">
    <h1>Contactez-nous</h1>
    <p class="form-intro">Une question, une commande spéciale ? Écrivez-nous, on répond vite.</p>
    <form id="formContact" class="form-card">
        <label>Nom  <input type="text" name="nom" required></label>
        <label>E-mail * <input type="email" name="email" required></label>
        <label>Message * <textarea name="message" rows="5" required></textarea></label>
        <label class="check"><input type="checkbox" name="consent" required>
            <span>J'accepte que mes données soient utilisées pour répondre à ma demande
            (<a href="politique-de-confidentialite.html" target="_blank">en savoir plus</a>). *</span></label>
        <p id="form-msg" class="form-msg" role="alert"></p>
        <button type="submit" class="btn">Envoyer</button>
    </form>
</main>
